[package]
name = "rget"
version = "0.1.0"
edition = "2024"
authors = ["JOBIANSTECHIE <jobianstechie@gmail.com>"]
description = "A fast resumable downloader written in Rust"
license = "MIT"
repository = "https://github.com/jobians/rust-resumable-downloader"

[lib]
name = "rget"
crate-type = ["cdylib", "rlib"]

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
jni = "0.21"
